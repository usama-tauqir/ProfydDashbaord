name: Deploy Next.js and Docker Image

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-pages:
    name: Build GitHub Pages
    runs-on: ubuntu-latest

    env:
      DEPLOY_TARGET: github-pages
      NEXT_TELEMETRY_DISABLED: "1"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Verify required files
        shell: bash
        run: |
          if [ ! -f "package.json" ]; then
            echo "Error: package.json was not found in the repository root."
            exit 1
          fi

          if [ ! -f "package-lock.json" ]; then
            echo "Error: package-lock.json was not found."
            echo "Run npm install locally and commit package-lock.json."
            exit 1
          fi

          if [ ! -f "next.config.mjs" ]; then
            echo "Error: next.config.mjs was not found."
            exit 1
          fi

      - name: Validate Next.js configuration
        run: node --check next.config.mjs

      - name: Install dependencies
        run: npm ci

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6
        with:
          token: ${{ github.token }}

      - name: Clean previous build
        run: rm -rf .next out

      - name: Build Next.js application
        run: npm run build

      - name: Verify static export
        shell: bash
        run: |
          if [ ! -d "./out" ]; then
            echo "Error: Next.js did not create the ./out directory."
            echo "Make sure output is set to export for GitHub Pages."
            exit 1
          fi

          if [ ! -f "./out/index.html" ]; then
            echo "Error: ./out/index.html was not generated."
            exit 1
          fi

          echo "Static export generated successfully."

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./out

  deploy-pages:
    name: Deploy GitHub Pages
    needs: build-pages
    runs-on: ubuntu-latest

    permissions:
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

  docker:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Verify Dockerfile
        shell: bash
        run: |
          if [ ! -f "./Dockerfile" ]; then
            echo "Error: Dockerfile was not found in the repository root."
            exit 1
          fi

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            usamatauqir381/profydrepo:latest
            usamatauqir381/profydrepo:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
