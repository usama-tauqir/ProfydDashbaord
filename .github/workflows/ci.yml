name: Build and Push Docker Image

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: false

jobs:
  docker:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Verify required files
        shell: bash
        run: |
          if [ ! -f "./Dockerfile" ]; then
            echo "Error: Dockerfile was not found."
            exit 1
          fi

          if [ ! -f "./package.json" ]; then
            echo "Error: package.json was not found."
            exit 1
          fi

          if [ ! -f "./package-lock.json" ]; then
            echo "Error: package-lock.json was not found."
            exit 1
          fi

          if [ ! -f "./next.config.mjs" ]; then
            echo "Error: next.config.mjs was not found."
            exit 1
          fi

      - name: Validate Next.js configuration
        run: node --check next.config.mjs

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            usamatauqir381/profydrepo:latest
            usamatauqir381/profydrepo:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
